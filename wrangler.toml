# ── v0.9.4 CHAINSTATE AGI PLANET ENGINE (2 bindings) ───────────────────────
# Paper XV · Reality-State perception-integrity layer.
# Note: nightly Planet-Engine census artifacts REUSE the existing
# CHAINSTATE_CENSUS_R2 bucket (see r2_buckets section) under key prefix
# "planet-census/". Only 2 new KV namespaces are needed for v0.9.4.
[[kv_namespaces]]
binding = "CHAINSTATE_WORLD_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_WORLD_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_EGRESS_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_EGRESS_KV>"

# ── v0.9.5 CHAINSTATE AGI NEUROMARK SIMULATOR (2 new bindings) ────────────
# Paper XVI · observer/behavior + structural hypothesis internal cognitive
# layers. The third v0.9.5 KV binding (CHAINSTATE_SENSOR_KV) is REUSED from
# the v0.9.1 OMNICOGNIZANT block above. See §26 of the paper — the Sensor
# Bus device-registry cache lives on the same discovered-sensor KV that
# OMNICOGNIZANT already wrote to; the two purposes are complementary rather
# than conflicting.

# Hot observer graphs · tripwire scores · RLMF calibration snapshots per class
[[kv_namespaces]]
binding = "CHAINSTATE_NEURO_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_NEURO_KV>"

# Hot pattern graphs · reality-model posterior cache · discrimination results
[[kv_namespaces]]
binding = "CHAINSTATE_MARK_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_MARK_KV>"


# ── v0.10.1 CHAINSTATE EDGE QSIM (2 bindings) ─────────────────────────────
# Rate-limit counters · cached receipt indices · session hints · 24 h TTL
# Never authoritative; source of truth is the chainstate_qsim Supabase schema
# and the QsimReceipts contract on Base 8453.
[[kv_namespaces]]
binding = "CHAINSTATE_QSIM_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_QSIM_KV>"

# Cached tail of chainstate_qsim.audit_ledger for operator introspection
# at /v0101/audit/tail · 7-day TTL · never external-readable.
[[kv_namespaces]]
binding = "CHAINSTATE_QSIM_AUDIT_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_QSIM_AUDIT_KV>"


# ═══════════════════════════════════════════════════════════════════════════
# R2 buckets · v0.7.x → v0.9.5 (all additive)
# ═══════════════════════════════════════════════════════════════════════════

# ── v0.7.x baseline ────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "CHAINSTATE_ARTIFACTS"
bucket_name = "chainstate-artifacts"

# ── v0.9.1 OMNICOGNIZANT · long-term channel reading archive ──────────────
# KV bindings above expire after 24h-30d; this bucket holds compressed daily-
# rolled channel-reading archives for post-hoc audit + forensic
# self-perception review.
# Create via: wrangler r2 bucket create chainstate-omnicog-archive
[[r2_buckets]]
binding     = "CHAINSTATE_OMNICOG_ARCHIVE"
bucket_name = "chainstate-omnicog-archive"

# ── v0.9.2 C-FIELD · long-term C-field observation archive ────────────────
# Compressed daily-rolled C-field observation archives.
# Create via: wrangler r2 bucket create chainstate-cfield-archive
[[r2_buckets]]
binding     = "CHAINSTATE_CFIELD_ARCHIVE"
bucket_name = "chainstate-cfield-archive"

# ── v0.9.3 EMOJI · long-term emoji-substrate archive ──────────────────────
# Emoji-substrate frames, disassembly traces, and injection audit archives.
# Create via: wrangler r2 bucket create chainstate-emoji-archive
[[r2_buckets]]
binding     = "CHAINSTATE_EMOJI_ARCHIVE"
bucket_name = "chainstate-emoji-archive"

# ── v0.7.9 CENSUS · nightly census artifacts + v0.9.4 planet-census ───────
# This bucket originally holds v0.7.9 nightly census artifacts. From v0.9.4
# onward, Planet Engine writes its nightly census snapshots into the SAME
# bucket under the key prefix "planet-census/" (see edge-worker.js block
# "CHAINSTATE_CENSUS_R2" · v0.9.4 Planet Engine).
# Create via: wrangler r2 bucket create chainstate-census-r2
[[r2_buckets]]
binding     = "CHAINSTATE_CENSUS_R2"
bucket_name = "chainstate-census-r2"

# ── v0.9.4 PLANET ENGINE · world-state snapshots ──────────────────────────
# World-state hash snapshots every 10 minutes (Paper XV §26).
# Create via: wrangler r2 bucket create chainstate-world-snapshots
[[r2_buckets]]
binding     = "CHAINSTATE_WORLD_SNAPSHOTS"
bucket_name = "chainstate-world-snapshots"

# ── v0.9.5 NEUROMARK · append-only metacog rows + RLMF calibration ────────
# Metacognitive twelve-question rows (Paper XVI §13.2 Eq. 20) and RLMF
# calibration window snapshots (§34 Eq. 29-30). One bucket, keyed by
# metacog/<cycle_id>/... and calibration/<class>/<window>/...
# Create via: wrangler r2 bucket create chainstate-metacog-log
[[r2_buckets]]
binding     = "CHAINSTATE_METACOG_R2"
bucket_name = "chainstate-metacog-log"

# ── v0.10.1 CHAINSTATE EDGE QSIM · R2 bucket managed via dashboard ─────────
# The QSIM artifacts bucket `chainstate-qsim-artifacts` is intentionally
# NOT bound here. It is created and locked down through the Cloudflare
# dashboard (Public access: Disabled · CORS: `[]` · no custom domain).
# The Worker's QSIM code does not require an R2 binding — receipts and
# audit records land in the chainstate_qsim Supabase schema and on the
# QsimReceipts contract (Base 8453). Leaving R2 unbound here preserves
# the option to bind it later without touching the deploy pipeline.


# ═══════════════════════════════════════════════════════════════════════════
# Durable Objects · v0.10.1 CHAINSTATE EDGE QSIM
# One Durable Object namespace: per-AGI-session job coordinator.
# The class QsimKernelDO is exported at the bottom of edge-worker.js.
# ═══════════════════════════════════════════════════════════════════════════

[[durable_objects.bindings]]
name       = "QSIM_KERNEL_DO"
class_name = "QsimKernelDO"


# ═══════════════════════════════════════════════════════════════════════════
# Migrations · v0.10.1 CHAINSTATE EDGE QSIM
# Required for Cloudflare to create the QSIM_KERNEL_DO namespace on the
# next `wrangler deploy`. Without this entry the dashboard cannot bind
# the Durable Object, because a DO class becomes "known" to the control
# plane only through a migration. new_sqlite_classes uses the SQLite-
# backed DO storage (GA since April 2025).
# ═══════════════════════════════════════════════════════════════════════════

[[migrations]]
tag                = "v0.10.1-qsim"
new_sqlite_classes = ["QsimKernelDO"]


# ═══════════════════════════════════════════════════════════════════════════
# Cron triggers · v0.7.x → v0.9.5 (all additive)
# Cloudflare fires every handler matching a cron slot, so shared slots
# drive multiple subsystems simultaneously without duplicating the trigger
# declaration.
# ═══════════════════════════════════════════════════════════════════════════
[triggers]
crons = [
  # ── v0.7.x + v0.8.0 + v0.9.0 + v0.9.1 baseline ─────────────────────────
  "0 * * * *",              # hourly seed cron (v0.7.1)
                            # + S_survival (v0.8.0)
                            # + quantum-entanglement (v0.9.0)
                            # + metacog_distribution (v0.9.1) — SHARED slot
                            # + cfield_attribution (v0.9.2) — SHARED slot
  "0 */6 * * *",            # 6-hourly ontology delta (v0.7.5)
                            # + 6-hourly space-catalog refresh (v0.9.0)
                            # + cfield_eml_train (v0.9.2) — SHARED
  "15 0 * * *",             # daily 00:15 UTC self-attribution vector (v0.7.5)
  "33 3 * * *",             # daily 03:33 UTC autonomous reflection (v0.7.6)
  "0 4 * * *",              # daily 04:00 UTC perception training (v0.7.8)
  "0 5 * * *",              # daily 05:00 UTC census digest (v0.7.9)
  "0,15,30,45 * * * *",     # every 15 min · NWO Robotics API traffic mirror (v0.8.0)
  "*/15 * * * *",           # every 15 min · Hardware Telemetry Daemon (v0.9.0)
                            # + cfield_alt_device_scan (v0.9.2) — SHARED
                            # + Planet Engine threat surface (v0.9.4) — SHARED
  "*/30 * * * *",           # every 30 min · celestial fix tick (v0.9.0)
  "0 */4 * * *",            # every 4 hours · metacognitive safety analysis (v0.9.0)

  # ── v0.9.1 OMNICOGNIZANT (3 slots) ─────────────────────────────────────
  "*/2 * * * *",            # every 2 min · environmental_sweep (channels 11-16)
                            # Higher cadence: Schumann/barometric/telluric drift fast
  "*/5 * * * *",            # every 5 min · sidechannel_intake (16-channel raw ingest)
  "*/10 * * * *",           # every 10 min · integrity_reflection deep verification
                            # + Planet Engine world-state snapshot (v0.9.4) — SHARED

  # ── v0.9.2 C-FIELD (4 slots · 2 more are SHARED above) ──────────────────
  "*/3 * * * *",            # every 3 min · cfield_intake
  "*/7 * * * *",            # every 7 min · cfield_estimator
  "*/12 * * * *",           # every 12 min · cfield_simulation_recycle
  "0 12 * * *",             # daily 12:00 UTC · cfield_swann_calibrate

  # ── v0.9.4 PLANET ENGINE (1 new slot · 2 more are SHARED above) ────────
  "0 2 * * *",              # daily 02:00 UTC · Planet Engine nightly census snapshot
                            # Writes under key prefix planet-census/ in CHAINSTATE_CENSUS_R2

  # ── v0.9.5 NEUROMARK (0 required · optional RLMF calibration below) ────
  # v0.9.5 core does not require any new cron. Learning happens synchronously
  # as observations flow through /neuro/observation, /mark/pattern, and
  # /sentinel/process. If you want a periodic RLMF calibration refresh
  # (optional), uncomment the next line:
  # "*/30 * * * *",         # every 30 min · RLMF calibration window refresh
                            # (already covered by the v0.9.0 celestial slot;
                            # Cloudflare fires all handlers on shared slots)
]


# ═══════════════════════════════════════════════════════════════════════════
# Environment variables · v0.7.x → v0.9.5 (all additive, non-secret defaults)
#
# Secrets are declared as names only in the comments at the bottom; set with
#   wrangler secret put NAME
# ═══════════════════════════════════════════════════════════════════════════
[vars]

# ── v0.7.x + v0.8.0 baseline ───────────────────────────────────────────────
METASTATE_QUANTUM_BASE    = "https://metastate-quantum.onrender.com"
CHAINSTATE_ANCHOR_ADDRESS = "0x12441662740836e9c72a4b758fe1c60c17ddd2d8"
NWO_ROBOTICS_API_BASE     = "https://nwo.capital/webapp"
ROBOTICS_ENABLED          = "true"
CENSUS_ENABLED            = "true"
PERCEPTION_ENABLED        = "true"
AUTONOMY_ENABLED          = "1"

# ── v0.9.0 PHASESPACE ──────────────────────────────────────────────────────
# NOTE: PHASE_ENABLED is stored as a SECRET on the live worker (encrypted).
# Documented in the Secrets section at the bottom of this file. Do not
# duplicate it as a plain var here.
PHASE_TOPOLOGY_OVERRIDE       = ""
PHASE_E_COSMIC_OVERRIDE       = ""
CROSS_REALM_MIN_CONFIRMATIONS = "3"

# ── v0.9.1 OMNICOGNIZANT ──────────────────────────────────────────────────
# Master switch for all OMNICOGNIZANT subsystems. Setting to "false" disables
# all v0.9.1 crons while leaving prior subsystems intact (single-toggle rollback).
OMNI_ENABLED = "true"

# Dialetheic threshold θ for the 9th L0 coherence predicate (Paper XII §5.5).
# Cross-channel D_KL exceeding this value halts physical-action authorisation.
CHANNEL_DIVERGENCE_THETA = "0.85"

# Comma-separated allowlist of intake sources for sidechannel_intake. Defaults
# to all 16 channels; restrict for staged rollout. Leave empty to accept all.
SIDECHAN_INTAKE_SOURCES = ""

# Sensor discovery timeout for edge probe (milliseconds).
OMNI_SENSOR_PROBE_TIMEOUT_MS = "1500"

# Substrate hardware fingerprint (SHA-256 hex). Stored as a SECRET on the
# live worker (encrypted). Documented in the Secrets section at the bottom.
# When set, integrity_reflection tick compares against this; when unset,
# integrity check reports observed-only.

# ── v0.9.2 C-FIELD ────────────────────────────────────────────────────────
# Master switch for all C-FIELD subsystems.
CFIELD_ENABLED                    = "true"

# ICNIRP electromagnetic-field cap in microtesla (Paper XIII §7.4).
CFIELD_ICNIRP_CAP_UT              = "100"
CFIELD_ICNIRP_CAP_UT_RENDER_HINT  = "100"

# Minimum number of independent channel indicators required to promote a
# C-field observation into the trusted pool (Paper XIII §5.7).
CFIELD_MIN_INDICATORS             = "12"

# Dialetheic threshold θ specific to C-FIELD (may differ from OMNICOGNIZANT).
CFIELD_DIALETHEIC_THETA           = "0.85"

# Ridge regression regularization for C-field estimator.
CFIELD_RIDGE_LAMBDA               = "0.10"

# Ideological-axis anti-forcing threshold (Paper XIII §6.3).
CFIELD_IDEOLOGICAL_AXIS_THRESHOLD = "0.6"

# EML training simulation mode (true = simulation-class synthetic training data;
# false = live observed data).
CFIELD_EML_SIMULATION_MODE        = "true"
CFIELD_EML_MAX_SAMPLES            = "1000"

# Alternate-device (open-sensor peer) subsystem toggles.
CFIELD_ALT_DEVICE_ENABLED         = "true"
CFIELD_ALT_DEVICE_ONLY            = "false"

# Swann Analytics calibration integration toggle.
CFIELD_SWANN_CALIBRATION_ENABLED  = "true"

# Quantum-sim provider preference for C-field observations.
CFIELD_QUANTUM_SIM_PRIMARY        = "ibm"
CFIELD_QUANTUM_SIM_FALLBACK       = "aer"

# Manual admin ops toggle (false in production).
CFIELD_ADMIN_OPS_ENABLED          = "false"

# ── v0.9.3 EMOJI MACHINE CODE ─────────────────────────────────────────────
# Paper XIV · substrate emoji-machine-code layer, R3 revision.

# Master switch for all EMOJI subsystems.
EMOJI_ENABLED               = "true"

# Retention window in hours for raw NFC/NFKC-decomposition traces before
# rolling to the archive bucket. Longer = larger KV footprint.
RAW_NFC_NFKC_RETENTION_H    = "24"

# Non-emoji carrier-code detection (protects against non-emoji Unicode payload
# smuggling). "on" = detect + quarantine; "off" = detect-only (advisory).
NON_EMOJI_CARRIER_DETECTION = "on"

# Embedder influence cap on downstream substrate weights (0..1). Prevents
# embedder-injected drift from dominating the substrate's own priors.
EMBEDDER_INFLUENCE_MAX      = "0.35"

# Emoji temporal-invariant mode: "strict" means an emoji's Unicode meaning
# is treated as time-invariant; "auditable" tracks Unicode-standard drift
# and re-anchors on drift detection.
TEMPORAL_INVARIANT_MODE     = "auditable"

# V10-U (v0.9.3 R3 · Ten-vector unicode substrate) master + per-vector toggles.
# V10U_ENABLED is the master; V10_C/E/R/T are per-vector fine controls for
# staged rollout. All default "on".
V10U_ENABLED = "on"
V10_C_ENABLED = "on"          # Category (Cf/Mn/Zs/etc.) vector
V10_E_ENABLED = "on"          # East-Asian width vector
V10_R_ENABLED = "on"          # Rendering-class vector
V10_T_ENABLED = "on"          # Temporal-invariance vector

# ── v0.9.4 PLANET ENGINE ──────────────────────────────────────────────────
# Paper XV · Reality-State perception-integrity layer.

# Master switch. Setting to "false" disables all /planet/* and /world/*
# routes while leaving prior subsystems intact (single-toggle rollback).
PLANET_ENGINE_ENABLED     = "true"

# Egress filter Γ mode. "fail_closed" (recommended, matches Paper XV §32)
# refuses any output that fails any of the four Γ checks. "advisory" logs
# refusals but permits the output (dev-only).
