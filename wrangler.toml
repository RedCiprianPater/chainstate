# Adversarial-fit threshold above which a hypothesis is flagged as
# insufficiently specific (Paper XVI §11.1).
MARK_ADV_MAX                = "0.6"
# Post-hoc hypothesis confidence cap.
MARK_POSTHOC_CAP            = "0.7"
# Reality-model discrimination minimum (Paper XVI §12.2 Eq. 19). Only
# observations exceeding this pairwise likelihood ratio update the posterior.
MARK_RM_DISCRIM_MIN         = "1.5"

# ── METACOG (Paper XVI §13, §34) ──
