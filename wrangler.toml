id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_ALTDEV_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_SWANN_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_SWANN_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_QSIM_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_QSIM_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_FALLBACK_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_FALLBACK_KV>"

# ── v0.9.3 CHAINSTATE AGI EMOJI MACHINE CODE (7 bindings) ──────────────────
# Paper XIV · substrate emoji-machine-code layer (R3 revision)
[[kv_namespaces]]
binding = "CHAINSTATE_EMOJI_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_EMOJI_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_DISASM_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_DISASM_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_INJECTION_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_INJECTION_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_QUARANTINE_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_QUARANTINE_KV>"

