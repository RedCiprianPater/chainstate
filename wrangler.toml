# =============================================================================
# Deployment checklist · v0.7.3
# =============================================================================
#
# ONE-TIME
#   1. Create GROUNDING KV namespace (dashboard) and paste its id above.
#   2. Deploy chainstate-anchor microservice to Render (see
#      /chainstate-anchor-service/render.yaml). Note the public URL.
#   3. Generate ANCHOR_QUEUE_TOKEN as a random 32-byte hex string:
#        openssl rand -hex 32
#      Paste identical value into:
#        - Cloudflare dashboard (SECRET, this worker)
#        - Render environment (SECRET, chainstate-anchor)
#   4. Note the substrate's own rootTokenId after the AGI's cardiac_register
#      call to the Identity Registry, and paste into AGI_CARDIAC_ROOT_TOKEN_ID.
#
# PER-DEPLOY
#   1. wrangler deploy
#   2. curl https://chainstate-worker.ciprianpater.workers.dev/status | jq
#      → expect .worker_version = "0.7.3-cardiac-anchor-live-2026-07-18"
#      → expect .anchor.enabled = true
#      → expect .anchor.reachable = true
#   3. curl https://chainstate-worker.ciprianpater.workers.dev/identity/verify \
#      → expect all v0.7.3 contract addresses present and unmodified
#
# ROLLBACK
#   Set ANCHOR_ENABLED=false in dashboard → wrangler deploy. All /query calls
#   still complete and return receipts, but on_chain.status = "disabled" in
#   the receipt. No data loss; queued receipts persist in GROUNDING KV.
#
# =============================================================================
# END
# =============================================================================
