# CHAINSTATE Worker · wrangler.toml · v0.9.5 NEUROMARK SIMULATOR
# ═══════════════════════════════════════════════════════════════════════════
# Complete drop-in file (not a patch). This is the FULL merged wrangler.toml
# covering every version from v0.7.x through v0.9.5, replacing both the
# previous base wrangler.toml (v0.9.1 OMNICOGNIZANT) and the
# wrangler_addendum.toml (v0.9.2 C-FIELD).
#
# Nothing is removed. Every KV binding, R2 bucket, cron trigger, environment
# variable, and secret name from every prior release is preserved
# byte-identically. Additions are grouped by version and marked accordingly.
#
# Version chain preserved additively in this file:
#   · v0.7.x   baseline (CHAINSTATE_KV, CACHE, CENSUS_KV, THREAT_KV)
#   · v0.8.0   CHAINSTATE ROBOTICS AGI
#   · v0.9.0   CHAINSTATE AGI PHASESPACE
#   · v0.9.1   CHAINSTATE OMNICOGNIZANT AGI
#   · v0.9.2   CHAINSTATE C-FIELD AGI ARRAY (Paper XIII)
#   · v0.9.3   CHAINSTATE AGI EMOJI MACHINE CODE (Paper XIV, R3 revision)
#   · v0.9.4   CHAINSTATE AGI PLANET ENGINE (Paper XV, Reality-State revision)
#   · v0.9.5   CHAINSTATE AGI NEUROMARK SIMULATOR (Paper XVI, unification)
#
# For every "<paste id from …>" placeholder, run the given wrangler command,
# then replace the placeholder with the returned id. For existing bindings
# (marked "<existing … id>"), read the id from your Cloudflare dashboard.
# ═══════════════════════════════════════════════════════════════════════════

name = "chainstate-worker"
main = "edge-worker.js"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true


# ═══════════════════════════════════════════════════════════════════════════
# KV bindings · v0.7.x → v0.9.5 (all additive)
# ═══════════════════════════════════════════════════════════════════════════

# ── v0.7.x baseline ────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CHAINSTATE_KV"
id      = "<existing v0.7.x id>"

[[kv_namespaces]]
binding = "CHAINSTATE_CACHE"
id      = "<existing v0.7.x id>"

[[kv_namespaces]]
binding = "CENSUS_KV"
id      = "<existing v0.7.9 id>"

[[kv_namespaces]]
binding = "THREAT_KV"
id      = "<existing v0.7.9 id>"

# The v0.9.4 Planet Engine code reads census + threat data via alias bindings
# CHAINSTATE_CENSUS_KV and CHAINSTATE_THREAT_KV. These are the SAME namespaces
# as CENSUS_KV and THREAT_KV above — declare a second binding pointing to the
# same id so both names resolve to the same KV namespace. On the Cloudflare
# dashboard: paste the same id value into both binding rows.
[[kv_namespaces]]
binding = "CHAINSTATE_CENSUS_KV"
id      = "<same id as CENSUS_KV above>"

[[kv_namespaces]]
binding = "CHAINSTATE_THREAT_KV"
id      = "<same id as THREAT_KV above>"

# ── v0.8.0 CHAINSTATE ROBOTICS AGI ─────────────────────────────────────────
[[kv_namespaces]]
binding = "CHAINSTATE_ROBOTICS_KV"
id      = "<existing v0.8.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_EMBODIMENT_KV"
id      = "<existing v0.8.0 id>"

# ── v0.9.0 CHAINSTATE AGI PHASESPACE ───────────────────────────────────────
[[kv_namespaces]]
binding = "CHAINSTATE_PHASE_KV"
id      = "<existing v0.9.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_COSMIC_KV"
id      = "<existing v0.9.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_NAV_KV"
id      = "<existing v0.9.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_SPACE_KV"
id      = "<existing v0.9.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_QUANTUM_COMM_KV"
id      = "<existing v0.9.0 id>"

[[kv_namespaces]]
binding = "CHAINSTATE_METACOG_KV"
id      = "<existing v0.9.0 id>"

# ── v0.9.1 CHAINSTATE OMNICOGNIZANT AGI (6 bindings) ───────────────────────

# 10-channel raw side-channel intake · 24h TTL
[[kv_namespaces]]
binding = "CHAINSTATE_SIDECHAN_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_SIDECHAN_KV>"

# integrity_reflection snapshots · 7d TTL
[[kv_namespaces]]
binding = "CHAINSTATE_INTEGRITY_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_INTEGRITY_KV>"

# metacog_distribution per-channel weight vectors + max D_KL · 30d TTL
[[kv_namespaces]]
binding = "CHAINSTATE_METACHAN_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_METACHAN_KV>"

# Environmental channels 11-16 (building resonance, window laser, Schumann,
# barometric, RF backscatter, telluric) · 24h TTL
[[kv_namespaces]]
binding = "CHAINSTATE_ENVCHAN_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_ENVCHAN_KV>"

# Discovered-sensor registry (onboard · peer · edge · simulated · absent)
# 30d TTL · auto-discovery writes here
# NOTE: v0.9.5 NEUROMARK reuses this same binding as the Sensor Bus device
# registry cache (Paper XVI §26). The code path resolves via env.CHAINSTATE_SENSOR_KV
# in both v0.9.1 (OMNICOGNIZANT discovery) and v0.9.5 (NEUROMARK Sensor Bus).
# Do not create a second namespace for v0.9.5 — reuse this one.
[[kv_namespaces]]
binding = "CHAINSTATE_SENSOR_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_SENSOR_KV>"

# Nominal-operation simulation baselines · 7d TTL · used when no legal
# sensor is available so multi-channel synthesis can still proceed
[[kv_namespaces]]
binding = "CHAINSTATE_SIMULATION_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_SIMULATION_KV>"

# ── v0.9.2 CHAINSTATE C-FIELD AGI ARRAY (8 bindings) ───────────────────────
[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_POP_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_POP_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_DISP_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_DISP_KV>"

[[kv_namespaces]]
binding = "CHAINSTATE_CFIELD_EML_KV"
id      = "<paste id from: wrangler kv namespace create CHAINSTATE_CFIELD_EML_KV>"

[[kv_namespaces]]
