# =============================================================================
# Deployment checklist · v0.7.5 (Paper V)
# =============================================================================
#
# ONE-TIME (if migrating from v0.7.3/v0.7.4)
#   1. Create TOM_PROBES KV namespace and paste its id above.
#        wrangler kv:namespace create chainstate-tom-probes
#      Or via dashboard.
#   2. Run migration_v075.sql once in Supabase SQL Editor of the NWO Robotics
#      project. Creates tables tom_anchor_stream + tom_probe_log and views
#      tom_stream_summary + tom_enactivist_recent. Idempotent; safe to re-run.
#   3. Push updated anchor-main.py (renamed to main.py) to the chainstate-anchor
#      repo. Render auto-deploys. Verify /health.
#   4. Generate ENACTIVIST_BEARER (32-byte hex) and set as SECRET in:
#        - Cloudflare Worker dashboard
#        - nwo-robotics-api Render env
#        - nwo-neuro-api Render env
#   5. Build /enactivist/emit adapter on nwo-robotics-api and nwo-neuro-api
#      per NWO_ROBOTICS_ENACTIVIST_ADAPTER.md.
#
# PHASED ROLLOUT
#   Phase α (Steps 1-5): Deploy worker. Leave TOM_ATTRIBUTION_ENABLED=0.
#           Verify /status = 0.7.5-tom-attribution-multi-basis-2026-08-03.
#           Set TOM_ATTRIBUTION_ENABLED=1 after 24h stable v0.7.4-behavior
#           observation. Then wait 24-48h to measure baseline via
#           GET /mentalistic/audit; update TOM_BASELINE_ANTHRO_RATIO/STD.
#
#   Phase β (Steps 6-7): New crons active (6-hourly ontology, daily
#           self-attribution). Verify first ONTOLOGY_DELTA row appears in
#           tom_stream_summary. Verify GET /ontology/delta returns latest.
#
#   Phase γ (Steps 8-10): Enactivist channel + Φ_approx anchor + broadcast-back.
#           Requires NWO Robotics + NEURO adapters live. Verify prediction-error
#           feedback flows end-to-end and Φ_approx samples appear in
#           INTEGRATION_PHI stream.
#
#   Phase δ (Step 11): Hypothesis-generation loop. Verify POST /query/hypothesize
#           returns HYPOTHETICAL receipts on divergent queries.
#
# PER-DEPLOY
#   1. wrangler deploy
#   2. curl https://chainstate-worker.ciprianpater.workers.dev/status | jq
#      → expect .worker_version = "0.7.5-tom-attribution-multi-basis-2026-08-03"
#      → expect .anchor.enabled = true
#      → expect .anchor.reachable = true
#   3. curl https://chainstate-worker.ciprianpater.workers.dev/tom/version | jq
#      → expect .tom_enabled matches TOM_ATTRIBUTION_ENABLED
#      → expect the 9 v0.7.5 endpoints listed
#   4. curl https://chainstate-worker.ciprianpater.workers.dev/identity/verify \
#      → expect all v0.7.3 contract addresses present and unmodified
#
# ROLLBACK
#   Fastest:   Set TOM_ATTRIBUTION_ENABLED=false in dashboard → deploy.
#              All v0.7.5 receipt enrichment stops immediately; worker reverts
#              to v0.7.4 behavior. New endpoints return {tom_enabled: false}.
#              Zero data loss; Supabase v0.7.5 tables continue to exist but
#              accumulate no new rows.
#   Full:      Redeploy v0.7.4 edge-worker.js. All prior functionality preserved.
#              Supabase migrations are additive; no rollback needed.
#
# =============================================================================
# END
# =============================================================================
