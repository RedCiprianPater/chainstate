NEURO_XVAL_MIN              = "0.85"

# ── MARK structural engine (Paper XVI §5, §10, §11) ──
# Discrimination log-ratio D (Eq. 9, 15) minimum for pattern promotion.
MARK_D_MIN                  = "2.0"
# Randomised-null trial count for the discrimination test.
