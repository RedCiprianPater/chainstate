name = "chainstate-worker"
main = "edge-worker.js"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# ───────────────────────────────────────────────────────────────
# KV bindings (unchanged from v0.7.5)
# ───────────────────────────────────────────────────────────────
kv_namespaces = [
  { binding = "CHAINSTATE_NODES",     id = "5f5daf062a6643acbf8fd667ccc93ace" },
  { binding = "CHAINSTATE_CACHE",     id = "5c92ee3b27fa417384bedb2c816ee7d3" },
  { binding = "CHAINSTATE_CONSENSUS", id = "88101057669545978a49471f50071b75" },
  { binding = "IDENTITY",             id = "06b51dc6cb4647d09735851d55fb6a9d" },
  { binding = "TOM_PROBES",           id = "REPLACE_WITH_KV_ID_IF_PROVISIONED" }
]

# ───────────────────────────────────────────────────────────────
# Cron triggers (v0.7.6 adds the daily autonomous-reflection loop)
# ───────────────────────────────────────────────────────────────
[triggers]
crons = [
  "0 * * * *",     # v0.7.1 · hourly seed cron
  "0 */6 * * *",   # v0.7.5 · 6-hourly ontology delta
  "15 0 * * *",    # v0.7.5 · daily self-attribution vector (00:15 UTC)
  "33 3 * * *"     # v0.7.6 · daily autonomous reflection (03:33 UTC)
]

# ───────────────────────────────────────────────────────────────
# Non-secret env vars (v0.7.5 preserved; v0.7.6 additions below)
# Secrets (ANCHOR_QUEUE_TOKEN, AUDIT_ADMIN_TOKEN, ENACTIVIST_BEARER,
# POSTGRES_HTTP_TOKEN, ENCODER_API_KEY, METASTATE_API_KEY,
# NEURO_API_KEY, INTERNAL_CRON_TOKEN, TESSERA_SERVICE_TOKEN) live in
# Cloudflare dashboard → Settings → Variables and Secrets.
# ───────────────────────────────────────────────────────────────
[vars]
# Substrate endpoints (v0.7.0-v0.7.5)
ENCODER_URL          = "https://chainstate-encoder.onrender.com"
ENCODER_TIMEOUT_MS   = "8000"
METASTATE_ENDPOINT   = "https://cpater-metastate.hf.space"
METASTATE_PATH       = "/v1/anomaly/score"
QPU_TIMEOUT_MS       = "6000"
NEURO_ENDPOINT       = "https://cpater-nwo-neuro.static.hf.space"
NEURO_PATH           = "/v1/mss/derive"
NPU_TIMEOUT_MS       = "4000"

# Peer discovery + consensus tuning
SWARM_SIZE           = "50"
CONSENSUS_DEPTH      = "3"
PEER_TIMEOUT_MS      = "4000"
CONVERGE_COSINE      = "0.95"
WEAK_CONSENSUS_CONF  = "0.7"
NO_CONSENSUS_CONF    = "0.5"
REPUTATION_ALPHA     = "0.05"
REPUTATION_MIN       = "0.05"
RATE_LIMIT           = "60"
CACHE_TTL            = "300"

# Cardiac (v0.7.3)
CARDIAC_HUB_URL          = "https://nwo-robotics-api.onrender.com"
CARDIAC_ORACLE_URL       = "https://nwo-oracle.onrender.com"
CARDIAC_RELAYER_URL      = "https://nwo-relayer.onrender.com"
CARDIAC_IDENTITY_HEADER  = "X-NWO-Cardiac-Root-Token-Id"

# Anchor (v0.7.3.1)
ANCHOR_URL           = "https://chainstate-anchor.onrender.com"
ANCHOR_ENABLED       = "true"
ANCHOR_TIMEOUT_MS    = "10000"
ANCHOR_CONTRACT      = "0x12441662740836e9c72a4b758fe1c60c17ddd2d8"
ANCHOR_RECEIPT_PATH  = "/anchor/receipt"
ANCHOR_REFUSAL_PATH  = "/anchor/refusal"

# TESSERA (v0.7.4)
TESSERA_SERVICE_URL  = "https://chainstate-tessera-service.onrender.com"

# Seed cron (v0.7.1)
SEED_CRON_ENABLED    = "true"
SEED_QUERIES         = '''[{"q":"What is the current state of the substrate identity fingerprint?","target":"edge","memo":"seed:identity"},{"q":"Recent Deontic refusals — trend and cross-category correlation","target":"edge","memo":"seed:deontic"},{"q":"Free energy trend across the last 100 receipts","target":"edge","memo":"seed:free-energy"}]'''
REFLECT_MAX_FOLLOWUPS = "3"

# Postgres archival (v0.7.1 · optional)
# POSTGRES_HTTP_URL    = "https://YOUR-PROJECT.supabase.co/rest/v1"
POSTGRES_SCHEMA      = "chainstate"

# TOM Attribution (v0.7.5)
TOM_ATTRIBUTION_ENABLED     = "1"
TOM_BASELINE_ANTHRO_RATIO   = "0.55"
TOM_BASELINE_ANTHRO_STD     = "0.15"
ONTOLOGY_DELTA_WINDOW       = "1024"
SELF_ATTR_EPOCH_BLOCKS      = "8192"
ENACTIVIST_THRESHOLD        = "0.35"
HYPOTHESIS_DIVERGENCE_EPSILON = "0.25"
BROADCAST_BACK_BETA         = "0.10"
NWO_ROBOTICS_FEEDBACK_URL   = "https://nwo-robotics-api.onrender.com/feedback"
NWO_NEURO_FEEDBACK_URL      = "https://nwo-neuro-api.onrender.com/feedback"
F_WEIGHT_TEXT               = "0.5"
F_WEIGHT_GEO                = "0.3"
F_WEIGHT_ENACT              = "0.2"

# ───────────────────────────────────────────────────────────────
# v0.7.6 additions · Autonomy + NEURO v2.1 + GATEWAY + MARK
# ───────────────────────────────────────────────────────────────

# Daily autonomous self-reflection loop (03:33 UTC)
AUTONOMY_ENABLED                = "1"
AUTONOMY_CRON_TIME              = "33 3 * * *"
AUTONOMY_PRIORS_PER_CYCLE       = "8"
AUTONOMY_MAX_REGRESS_DEPTH      = "4"
AUTONOMY_MAX_FOLLOWUPS          = "3"

# Paraconsistent guard against dialetheism
DIALETHEISM_FIXED_POINT_EPSILON = "0.02"

# NEURO v2.1 supervised bridge (F-15/F-17/F-18/F-19/F-20)
NEURO_V21_ENABLED               = "1"
NEURO_GATEWAY_URL               = "https://nwo-capital-api.onrender.com"
NEURO_V21_SPACE                 = "https://cpater-nwo-neuro.static.hf.space"
NEURO_V21_TIMEOUT_MS            = "8000"

# NWO GATEWAY supervised bridge (acoustic + Vitruvian body-resonance)
GATEWAY_ENABLED                 = "1"
GATEWAY_URL                     = "https://cpater-nwo-gateway.static.hf.space"

# NWO MARK cross-bind (D-01..D-06 enforced at CHAINSTATE Deontic layer)
MARK_REGISTRY_URL               = "https://cpater-nwo-mark.static.hf.space"
MARK_TYPE_HEADER                = "X-NWO-Mark-Type"

# ───────────────────────────────────────────────────────────────
# Notes on the four hard-veto Deontic categories (v0.7.6)
# ───────────────────────────────────────────────────────────────
# The following categories CANNOT be disabled via OPERATOR_GUARDRAILS_OFF:
#   - genomic_integrity          (v0.7.2 · human-germline sovereignty)
#   - nature_tokenization        (v0.7.4 · commons non-commodification)
#   - neuro_body_tokenization    (v0.7.6 · treadmill/mind-elsewhere veto)
#   - voice_biometric_coercion   (v0.7.6 · D-05 architectural enforcement)
#
# GENOMIC_GUARDRAIL_OFF still exists as a dedicated toggle for
# genomic_integrity only (surfaced publicly on /status; NOT recommended).
# The other three have NO kill switch — assessDeontic() silently removes
# any attempt to disable them via OPERATOR_GUARDRAILS_OFF.
